name: jcv_app
description: App móvil de Jalisco Cómo Vamos. Reto Tec ago-dic 2026, equipo LinuxVSWindows.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.29.0"

# Rangos amplios a propósito: pub elige la versión más nueva que sea
# compatible con el Flutter que tenga cada quien en su máquina.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ">=1.0.8 <3.0.0"
  flutter_secure_storage: ">=9.2.2 <12.0.0"
  go_router: ">=14.8.0 <19.0.0"
  provider: ^6.1.2
  supabase: ^2.16.5
  flutter_dotenv: ^6.0.0
  speech_to_text: ^7.4.0
  pdf: ^3.12.0
  printing: ^5.14.3
  # ponytail: image 4.11 usa una función de archive 4.1, pero pdf 3.12 no deja
  # pasar de archive 4.0.x (y pdf 3.13 pide Dart 3.12). Quitar al subir Flutter.
  image: ">=4.0.0 <4.11.0"
  amazon_cognito_identity_dart_2: ^4.0.1
  flutter_web_auth_2: ^5.1.0
  http: ^1.6.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_lints: ">=5.0.0 <7.0.0"
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Como en CCL: URL y anon key de Supabase. No va en git; se pasa por fuera.
  # Viaja dentro de la app, así que solo llaves públicas (nunca la de Anthropic).
  assets:
    - .env
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
